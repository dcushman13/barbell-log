<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11161C">
<title>Barbell Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#11161C; --card:#1A222C; --card2:#212C38; --line:#2C3846;
  --text:#E6EDF5; --dim:#8C9AAB; --done:#1D6FBF; --rest:#C8102E; --warm:#B8860B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;-webkit-text-size-adjust:100%}
body{padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;background:var(--card2);color:var(--text);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.num{font-variant-numeric:tabular-nums}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.h1{font-size:20px;font-weight:600}
.link{color:var(--dim);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{font-size:12px;color:var(--dim)}
.sub{font-size:13px;color:var(--dim)}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--text);
  padding:13px 16px;font-size:16px;font-weight:500;display:block;width:100%;text-align:center;
  text-decoration:none}
a.btn,a.btn:visited,a.btn:hover{color:var(--text);text-decoration:none}
a.btn.solid,a.btn.solid:visited{color:#fff}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
  display:flex;align-items:center;justify-content:center;color:var(--text);flex:none}
.tabbar{display:flex;gap:8px;margin-bottom:16px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:5px}
.tabbar button{flex:1;padding:11px;border-radius:10px;font-size:15px;font-weight:500;color:var(--dim)}
.tabbar button.on{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.solid{background:var(--done);border-color:var(--done);color:#fff}
.btn.warn{background:transparent;border-color:var(--rest);color:var(--rest)}
.btn:disabled{opacity:.4}
.grid{display:flex;gap:8px}
.grid>*{flex:1}
.step{width:38px;height:38px;border-radius:10px;background:var(--card2);
  border:1px solid var(--line);font-size:20px;line-height:1;flex:none}
.wt{font-size:24px;font-weight:600;min-width:66px;text-align:center}
.sets{display:flex;gap:8px;margin-top:14px}
.set{flex:1;height:60px;border-radius:12px;background:var(--card2);border:1px solid var(--line);
  color:var(--dim);font-size:20px;font-weight:600}
.set.hit{background:var(--done);border-color:var(--done);color:#fff}
.set.miss{background:var(--rest);border-color:var(--rest);color:#fff}
.set.warm{background:transparent;border-color:var(--warm);color:var(--warm);height:48px;font-size:15px}
.set.warm.hit{background:var(--warm);border-color:var(--warm);color:#11161C}
.bar{position:sticky;bottom:8px;margin-top:14px;border-radius:16px;padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--rest);border:1px solid var(--rest)}
.bar.off{background:var(--card2);border-color:var(--line)}
.clock{font-size:30px;font-weight:600;color:#fff;line-height:1.05}
.ghost{border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:8px 12px;color:#fff;font-size:14px}
.plate{display:inline-flex;align-items:center;gap:6px;background:var(--card2);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin:4px 6px 0 0;font-size:14px}
.item{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);text-align:center;font-size:14px;color:var(--dim)}
.tab.on{background:var(--card2);color:var(--text)}
.note{font-size:12px;color:var(--dim);line-height:1.6;margin-top:10px}
textarea{width:100%;height:220px;background:var(--card);color:var(--dim);border:1px solid var(--line);
  border-radius:12px;padding:12px;font-family:ui-monospace,monospace;font-size:12px}
.pill{display:inline-block;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);font-size:14px;margin:0 6px 6px 0}
.pill.on{background:var(--done);border-color:var(--done);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
var KEY = "barbelllog.v2";
var DAYS = ["SU","MO","TU","WE","TH","FR","SA"];
var DAYNAME = {SU:"Sun",MO:"Mon",TU:"Tue",WE:"Wed",TH:"Thu",FR:"Fri",SA:"Sat"};

var DEFAULT = {
  bar: 45,
  plates: [45,35,25,10,5,2.5],
  weights: {"Squat":145,"Bench Press":125,"Barbell Row":75,"Overhead Press":55,"Deadlift":205},
  inc: {"Squat":5,"Bench Press":5,"Barbell Row":5,"Overhead Press":5,"Deadlift":10},
  workouts: [
    {id:"A", name:"Workout A", lifts:[
      {name:"Squat", sets:3, reps:5, rest:180, warmup:true},
      {name:"Bench Press", sets:3, reps:5, rest:180, warmup:true},
      {name:"Barbell Row", sets:3, reps:5, rest:120, warmup:false}
    ]},
    {id:"B", name:"Workout B", lifts:[
      {name:"Squat", sets:3, reps:5, rest:180, warmup:true},
      {name:"Overhead Press", sets:3, reps:5, rest:180, warmup:true},
      {name:"Deadlift", sets:1, reps:5, rest:180, warmup:true, minWarm:135}
    ]}
  ],
  nextId: "A",
  fails: {},
  history: [],
  activities: [],
  food: [],
  targets: {kcal: 2350, protein: 190},
  filterJunk: true,
  schedule: {liftDays:["MO","TH"], liftTime:"17:30", runDays:["TU","FR","SA"], runTime:"07:00"}
};

var S = null, view = "home", tab = "lift", session = null, restEnd = null, msg = "";
var navStack = [{v:"home", t:"lift"}];

// ---------- storage ----------
function load(){
  try { var raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : clone(DEFAULT); }
  catch(e){ S = clone(DEFAULT); }
  if(!S.schedule) S.schedule = clone(DEFAULT.schedule);
  if(!S.activities) S.activities = [];
  if(S.filterJunk === undefined) S.filterJunk = true;
  if(!S.food) S.food = [];
  if(!S.targets) S.targets = {kcal: 2350, protein: 190};
  S.workouts.forEach(function(w){ w.lifts.forEach(function(l){
    if(l.minWarm === undefined) l.minWarm = /deadlift|clean|snatch|row from floor/i.test(l.name) ? 135 : 0;
  }); });
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ msg = "Couldn't save — storage may be full or blocked."; }
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }

// ---------- helpers ----------
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function mmss(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function round(n,step){ return Math.round(n/step)*step; }
function wt(name){ return S.weights[name] != null ? S.weights[name] : S.bar; }
function incOf(name){ return S.inc[name] != null ? S.inc[name] : 5; }
function workout(id){ for(var i=0;i<S.workouts.length;i++) if(S.workouts[i].id===id) return S.workouts[i]; return S.workouts[0]; }

function platesFor(total){
  var per = (total - S.bar)/2;
  if(per < 0) return {err:"Below bar weight"};
  if(per === 0) return {list:[], rem:0};
  var list=[], rem=per, inv=S.plates.slice().sort(function(a,b){return b-a;});
  for(var i=0;i<inv.length;i++){
    var n = Math.floor((rem + 1e-9)/inv[i]);
    if(n>0){ list.push([inv[i],n]); rem = Math.round((rem - n*inv[i])*100)/100; }
  }
  return {list:list, rem:rem};
}

function warmupsFor(work, minW){
  var b = S.bar;
  var start = (minW && minW > b) ? minW : b;
  if(work <= start + 10) return start === b ? [{w:b,reps:5},{w:b,reps:5}] : [{w:start,reps:5}];
  var out = start === b ? [{w:b,reps:5},{w:b,reps:5}] : [{w:start,reps:5}];
  var last = start;
  var steps = [[0.4,5],[0.6,3],[0.8,2]];
  for(var i=0;i<steps.length;i++){
    // round so each side lands on a multiple of 5 — no 2.5s on warm-ups
    var x = b + Math.round((steps[i][0]*(work-b))/10)*10;
    if(x > last && x < work){ out.push({w:x, reps:steps[i][1]}); last = x; }
  }
  return out;
}

// ---------- rest timer ----------
function startRest(sec){ restEnd = Date.now() + sec*1000; render(); }
function restLeft(){ return restEnd ? Math.max(0, Math.ceil((restEnd - Date.now())/1000)) : 0; }
var buzzed = false;
setInterval(function(){
  if(!restEnd) return;
  var l = restLeft();
  if(l === 0 && !buzzed){ buzzed = true; try{ navigator.vibrate && navigator.vibrate([220,90,220]); }catch(e){} }
  if(l > 0) buzzed = false;
  var el = document.getElementById("clock");
  if(el){ el.textContent = mmss(l); var bar=document.getElementById("restbar");
    if(bar) bar.className = "bar" + (l>0 ? "" : " off"); }
}, 250);

// ---------- session ----------
function startWorkout(){
  var w = workout(S.nextId);
  session = { id:w.id, name:w.name, date:todayISO(), bw:"", lifts: w.lifts.map(function(l){
    var working = wt(l.name);
    return { name:l.name, sets:l.sets, reps:l.reps, rest:l.rest, weight:working, minWarm:l.minWarm || 0,
      warm: l.warmup ? warmupsFor(working, l.minWarm).map(function(x){ return {w:x.w, reps:x.reps, done:false}; }) : [],
      logged: new Array(l.sets).fill(null) };
  })};
  restEnd = null; view = "workout"; render();
}
function tapSet(li,si){
  var l = session.lifts[li], cur = l.logged[si];
  if(cur === null){ l.logged[si] = l.reps; startRest(l.rest); return; }
  if(cur === 0){ l.logged[si] = null; } else { l.logged[si] = cur - 1; }
  render();
}
function tapWarm(li,wi){
  var w = session.lifts[li].warm[wi];
  w.done = !w.done;
  if(w.done) startRest(60); else render();
}
function bumpSession(li,d){
  var l = session.lifts[li];
  l.weight = Math.max(S.bar, round(l.weight + d, 2.5));
  if(l.warm.length) l.warm = warmupsFor(l.weight, l.minWarm).map(function(x){ return {w:x.w,reps:x.reps,done:false}; });
  render();
}
function finishWorkout(){
  var rec = { date: session.date, name: session.name,
    bw: session.bw ? Number(session.bw) : null,
    lifts: session.lifts.map(function(l){
      return { name:l.name, weight:l.weight, target:l.sets+"x"+l.reps,
        logged: l.logged.map(function(r){ return r === null ? 0 : r; }) };
    })};
  session.lifts.forEach(function(l){
    var clean = l.logged.every(function(r){ return r === l.reps; });
    if(clean){ S.weights[l.name] = l.weight + incOf(l.name); S.fails[l.name] = 0; }
    else {
      var f = (S.fails[l.name] || 0) + 1;
      if(f >= 3){ S.weights[l.name] = Math.max(S.bar, round(l.weight*0.9, 5)); S.fails[l.name] = 0; }
      else { S.weights[l.name] = l.weight; S.fails[l.name] = f; }
    }
  });
  S.history.unshift(rec);
  var i = S.workouts.findIndex(function(w){ return w.id === session.id; });
  S.nextId = S.workouts[(i+1) % S.workouts.length].id;
  save(); session = null; restEnd = null; view = "home"; render();
}

// ---------- activities ----------
function dur2sec(s){
  if(!s) return 0;
  var p = String(s).trim().split(":").map(Number);
  if(p.some(isNaN)) return 0;
  if(p.length === 3) return p[0]*3600 + p[1]*60 + p[2];
  if(p.length === 2) return p[0]*60 + p[1];
  return p[0] || 0;
}
function sec2dur(t){
  t = Math.round(t);
  var h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0");
}
function paceOf(a){
  if(!a.dist || !a.sec) return "";
  var t = (a.type||"").toLowerCase();
  if(/cycl|bike|ride|swim|row/.test(t)) return (a.dist/(a.sec/3600)).toFixed(1) + " mph";
  return sec2dur(a.sec / a.dist) + "/mi";
}
function num(v){
  if(v == null) return 0;
  var n = parseFloat(String(v).replace(/,/g,"").replace(/[^0-9.\-]/g,""));
  return isNaN(n) ? 0 : n;
}

function parseCSV(text){
  var rows = [], row = [], cur = "", q = false;
  text = text.replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(q){
      if(c === '"' && text[i+1] === '"'){ cur += '"'; i++; }
      else if(c === '"'){ q = false; }
      else cur += c;
    } else {
      if(c === '"') q = true;
      else if(c === ","){ row.push(cur); cur = ""; }
      else if(c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
      else cur += c;
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return c.trim() !== ""; }); });
}

function importGarmin(text){
  var rows = parseCSV(text);
  if(rows.length < 2){ msg = "That file didn't have any rows I could read."; render(); return; }
  var head = rows[0].map(function(h){ return h.trim().toLowerCase(); });
  function col(){
    for(var i=0;i<arguments.length;i++){
      var j = head.indexOf(arguments[i]);
      if(j >= 0) return j;
    }
    return -1;
  }
  var cType = col("activity type","activitytype","type"),
      cDate = col("date","start time","activity date"),
      cTitle = col("title","activity name","name"),
      cDist = col("distance","distance (mi)","distance (km)","km"),
      cTime = col("time","total time","elapsed time","moving time","sec"),
      cHR   = col("avg hr","average hr","avg heart rate","avg. hr"),
      cCad  = col("avg run cadence","avg cadence","average run cadence"),
      cCal  = col("calories"),
      cPace = col("avg pace","average pace");

  if(cDate < 0 || cTime < 0){
    msg = "Couldn't find Date and Time columns — is this the Garmin activity list export?";
    render(); return;
  }
  var added = 0, dupe = 0;
  for(var r=1; r<rows.length; r++){
    var row = rows[r];
    var rawDate = (row[cDate] || "").trim();
    if(!rawDate) continue;
    var date = rawDate.slice(0,10);
    var m = date.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m) date = m[3]+"-"+String(m[1]).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0");
    var secs = dur2sec(row[cTime]);
    if(!secs) secs = num(row[cTime]);
    var a = {
      date: date,
      type: cType >= 0 ? (row[cType]||"").trim() : "Activity",
      title: cTitle >= 0 ? (row[cTitle]||"").trim() : "",
      dist: cDist >= 0 ? num(row[cDist]) : 0,
      sec: secs,
      hr: cHR >= 0 ? Math.round(num(row[cHR])) : 0,
      cad: cCad >= 0 ? Math.round(num(row[cCad])) : 0,
      cal: cCal >= 0 ? Math.round(num(row[cCal])) : 0,
      pace: cPace >= 0 ? (row[cPace]||"").trim() : "",
      src: "garmin"
    };
    if(!a.sec && !a.dist) continue;
    var key = a.date + "|" + a.title + "|" + a.sec;
    if(S.activities.some(function(x){ return x.date+"|"+x.title+"|"+x.sec === key; })){ dupe++; continue; }
    S.activities.push(a);
    added++;
  }
  S.activities.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  save();
  msg = "Imported " + added + " activit" + (added===1?"y":"ies") + (dupe ? ", skipped " + dupe + " already there." : ".");
  render();
}

function pickFile(handler){
  var fn = handler === "sl" ? importStronglifts : handler === "food" ? importFood : importGarmin;
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".csv,text/csv,text/plain";
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){ fn(String(fr.result)); };
    fr.onerror = function(){ msg = "Couldn't read that file."; render(); };
    fr.readAsText(f);
  };
  inp.click();
}

function importStronglifts(text){
  var rows = parseCSV(text);
  if(rows.length < 2){ msg = "That file didn't have any rows I could read."; render(); return; }
  var head = rows[0].map(function(h){ return h.trim().toLowerCase(); });
  function col(){
    for(var i=0;i<arguments.length;i++){ var j = head.indexOf(arguments[i]); if(j>=0) return j; }
    return -1;
  }
  var cDate = col("date (yyyy/mm/dd)","date"),
      cWnum = col("workout"),
      cWname = col("workout name"),
      cBw = col("body weight (lbs)","body weight"),
      cEx = col("exercise"),
      cSxR = col("setsxreps"),
      cTop = col("top set reps x lbs");
  if(cDate < 0 || cEx < 0){
    msg = "Couldn't find Date and Exercise columns — is this the StrongLifts CSV export?";
    render(); return;
  }
  var setCols = [];
  for(var n = 1; n <= 8; n++){
    var r = col("set "+n+" (reps)"), lb = col("set "+n+" (lbs)");
    if(r >= 0) setCols.push([r, lb]);
  }

  var groups = {}, order = [];
  for(var i = 1; i < rows.length; i++){
    var row = rows[i];
    var raw = (row[cDate] || "").trim();
    if(!raw) continue;
    var date = raw.slice(0,10).replace(/\//g, "-");
    var key = date + "#" + (cWnum >= 0 ? (row[cWnum]||"") : "");
    if(!groups[key]){
      groups[key] = { date: date,
        name: (cWname >= 0 && (row[cWname]||"").trim()) || "Workout",
        bw: cBw >= 0 && num(row[cBw]) ? num(row[cBw]) : null,
        sid: "sl:" + key,
        lifts: [] };
      order.push(key);
    }
    var name = (row[cEx] || "").trim();
    if(!name) continue;
    var reps = [], weight = 0;
    setCols.forEach(function(c){
      var r = num(row[c[0]]), lb = c[1] >= 0 ? num(row[c[1]]) : 0;
      if(r > 0 || lb > 0){ reps.push(Math.round(r)); if(lb > weight) weight = lb; }
    });
    if(!reps.length && cTop >= 0){
      var m = (row[cTop] || "").match(/(\d+)\s*x\s*([\d.]+)/i);
      if(m){ reps = [Number(m[1])]; weight = Number(m[2]); }
    }
    if(!reps.length) continue;
    groups[key].lifts.push({ name: name, weight: weight, logged: reps,
      target: (cSxR >= 0 && (row[cSxR]||"").trim()) || (reps.length + "x" + reps[0]) });
  }

  var added = 0, dupe = 0;
  var seen = {};
  S.history.forEach(function(h){ if(h.sid) seen[h.sid] = 1; });
  order.forEach(function(k){
    var g = groups[k];
    if(!g.lifts.length) return;
    if(seen[g.sid]){ dupe++; return; }
    seen[g.sid] = 1;
    S.history.push(g);
    added++;
  });
  S.history.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  save();
  msg = "Imported " + added + " session" + (added===1?"":"s")
    + (dupe ? ", skipped " + dupe + " already there." : ".")
    + (added ? " Your current working weights weren't changed." : "");
  render();
}

function addRunManual(){
  function v(id){ var e = document.getElementById(id); return e ? e.value.trim() : ""; }
  var d = v("r_date") || todayISO();
  var dist = num(v("r_dist")), sec = dur2sec(v("r_time"));
  if(!dist && !sec){ msg = "Add at least a distance or a time."; render(); return; }
  S.activities.unshift({
    date: d, type: v("r_type") || "Running", title: v("r_title"),
    dist: dist, sec: sec, hr: Math.round(num(v("r_hr"))),
    cad: Math.round(num(v("r_cad"))), cal: Math.round(num(v("r_cal"))), pace: "", src: "manual"
  });
  S.activities.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  msg = ""; save(); render();
}
function delActivity(i){ S.activities.splice(i,1); save(); render(); }


// ---------- food ----------
var MEALS = ["breakfast","lunch","dinner","snack"];

function foodOn(date){ return S.food.filter(function(f){ return f.date === date; }); }
function burnOn(date){
  var n = 0;
  S.activities.forEach(function(a){ if(String(a.date).slice(0,10) === date) n += (a.cal || 0); });
  return n;
}
function dayTotals(date){
  var k = 0, p = 0;
  foodOn(date).forEach(function(f){ k += f.kcal || 0; p += f.protein || 0; });
  return {kcal:k, protein:p, burn:burnOn(date), net:k - burnOn(date)};
}
function lastDays(n){
  var out = [];
  for(var i = 0; i < n; i++){
    var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    var key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    out.push({date:key, t:dayTotals(key)});
  }
  return out;
}
function avgOver(n){
  var rows = lastDays(n).filter(function(r){ return r.t.kcal > 0; });
  if(!rows.length) return null;
  var k = 0, p = 0, b = 0;
  rows.forEach(function(r){ k += r.t.kcal; p += r.t.protein; b += r.t.burn; });
  return {days:rows.length, kcal:Math.round(k/rows.length), protein:Math.round(p/rows.length),
    burn:Math.round(b/rows.length), net:Math.round((k-b)/rows.length)};
}
function addFood(){
  function v(id){ var e = document.getElementById(id); return e ? e.value.trim() : ""; }
  var name = v("f_item"), kcal = Math.round(num(v("f_kcal")));
  if(!name){ msg = "Give the item a name."; render(); return; }
  if(!kcal){ msg = "Add a calorie figure."; render(); return; }
  S.food.unshift({ date: v("f_date") || todayISO(), meal: v("f_meal") || "snack",
    item: name, kcal: kcal, protein: Math.round(num(v("f_protein"))) });

function delFood(date, i){

function importFood(text){
  var rows = parseCSV(text);
  if(rows.length < 2){ msg = "That file didn't have any rows I could read."; render(); return; }
  var head = rows[0].map(function(h){ return h.trim().toLowerCase(); });
  function col(){ for(var i=0;i<arguments.length;i++){ var j = head.indexOf(arguments[i]); if(j>=0) return j; } return -1; }
  var cDate = col("date"), cMeal = col("meal"), cItem = col("item","food","name"),
      cKcal = col("calories","kcal","cal"), cProt = col("protein","protein_g","g_protein");
  if(cDate < 0 || cItem < 0 || cKcal < 0){
    msg = "Need date, item and calories columns."; render(); return;
  }
  var added = 0, dupe = 0;
  for(var r = 1; r < rows.length; r++){
    var row = rows[r];
    var date = (row[cDate] || "").trim().slice(0,10).replace(/\//g,"-");
    var item = (row[cItem] || "").trim();
    if(!date || !item) continue;
    var e = { date: date, meal: cMeal >= 0 ? (row[cMeal]||"snack").trim().toLowerCase() : "snack",
      item: item, kcal: Math.round(num(row[cKcal])), protein: cProt >= 0 ? Math.round(num(row[cProt])) : 0 };
    var key = e.date + "|" + e.item + "|" + e.kcal;
    if(S.food.some(function(x){ return x.date+"|"+x.item+"|"+x.kcal === key; })){ dupe++; continue; }
    S.food.push(e); added++;
  }
  S.food.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  save();
  msg = "Imported " + added + " item" + (added===1?"":"s") + (dupe ? ", skipped " + dupe + " already there." : ".");
  render();
}

// ---------- calendar ----------
function nextDateFor(day, time){
  var target = DAYS.indexOf(day), now = new Date();
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var delta = (target - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + delta);
  var p = time.split(":");
  d.setHours(Number(p[0]), Number(p[1]), 0, 0);
  if(d < now) d.setDate(d.getDate() + 7);
  return d;
}
function stamp(d){
  function p(n){ return String(n).padStart(2,"0"); }
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(d.getHours())+p(d.getMinutes())+"00";
}
function gcalLink(title, days, time, mins, details){
  var start = nextDateFor(days[0], time);
  var end = new Date(start.getTime() + mins*60000);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(title) +
    "&dates=" + stamp(start) + "/" + stamp(end) +
    "&recur=" + encodeURIComponent("RRULE:FREQ=WEEKLY;BYDAY=" + days.join(",")) +
    "&details=" + encodeURIComponent(details || "");
}
function icsText(){
  var L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Barbell Log//EN","CALSCALE:GREGORIAN"];
  function ev(uid, title, days, time, mins, desc){
    var s = nextDateFor(days[0], time), e = new Date(s.getTime()+mins*60000);
    L.push("BEGIN:VEVENT","UID:"+uid+"@barbelllog","DTSTAMP:"+stamp(new Date())+"Z",
      "DTSTART:"+stamp(s),"DTEND:"+stamp(e),
      "RRULE:FREQ=WEEKLY;BYDAY="+days.join(","),
      "SUMMARY:"+title,"DESCRIPTION:"+desc,"END:VEVENT");
  }
  if(S.schedule.liftDays.length)
    ev("lift","Lifting",S.schedule.liftDays,S.schedule.liftTime,60,"Alternating Workout A and B");
  if(S.schedule.runDays.length)
    ev("run","Run",S.schedule.runDays,S.schedule.runTime,35,"Run/walk intervals, metronome 158");
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function download(name, text, type){
  var b = new Blob([text], {type:type||"text/plain"});
  var u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u); }, 2000);
}
function toggleDay(kind, day){
  var arr = S.schedule[kind];
  var i = arr.indexOf(day);
  if(i >= 0) arr.splice(i,1); else { arr.push(day); arr.sort(function(a,b){ return DAYS.indexOf(a)-DAYS.indexOf(b); }); }
  save(); render();
}

// ---------- cardio rollups ----------
function onFoot(t){ return /run|walk|hik|treadmill|jog/i.test(t || ""); }
function realFoot(a){
  if(!onFoot(a.type)) return false;
  if(!S.filterJunk) return (a.dist > 0);
  if(!(a.dist > 0) || !(a.sec > 0)) return false;
  var t = a.type || "", minCad, loPace, hiPace;
  if(/hik/i.test(t)){ minCad = 40; loPace = 15; hiPace = 60; }
  else if(/run|jog|treadmill/i.test(t)){ minCad = 100; loPace = 4; hiPace = 16; }
  else { minCad = 60; loPace = 10; hiPace = 25; }
  if(a.cad > 0) return a.cad >= minCad;
  var mpm = a.sec / a.dist / 60;
  return mpm >= loPace && mpm <= hiPace;
}
function junkCount(days){
  var cut = new Date(); cut.setHours(0,0,0,0);
  cut.setDate(cut.getDate() - (days - 1));
  var n = 0;
  S.activities.forEach(function(a){
    var d = dayKey(a);
    if(isNaN(d) || d < cut) return;
    if(onFoot(a.type) && !realFoot(a)) n++;
  });
  return n;
}
function dayKey(a){ return new Date(String(a.date).slice(0,10) + "T00:00:00"); }

function rolling(days){
  var cut = new Date(); cut.setHours(0,0,0,0);
  cut.setDate(cut.getDate() - (days - 1));
  var miles = 0, cals = 0, foot = 0, all = 0;
  S.activities.forEach(function(a){
    var d = dayKey(a);
    if(isNaN(d) || d < cut) return;
    all++;
    cals += a.cal || 0;
    if(realFoot(a)){ miles += a.dist || 0; foot++; }
  });
  return {miles:miles, cals:cals, foot:foot, all:all};
}

function pacePoints(kind){
  var re = kind === "walk" ? /walk/i : /run|jog|treadmill/i;
  var out = [];
  for(var i = S.activities.length - 1; i >= 0; i--){
    var a = S.activities[i];
    if(!re.test(a.type || "")) continue;
    if(!realFoot(a)) continue;
    if(!(a.dist > 0) || !(a.sec > 0)) continue;
    var v = a.sec / a.dist;
    if(!isFinite(v) || v <= 0) continue;
    out.push({d:a.date, v:v});
  }
  return out;
}
function hasPace(kind){ return pacePoints(kind).length > 0; }

// ---------- charts ----------
function goodLift(l){
  if(!l || !(l.weight > 0)) return false;
  if(!l.logged || !l.logged.length) return false;
  return l.logged.some(function(r){ return r > 0; });
}
function seriesFor(name){
  var out = [];
  for(var i = S.history.length - 1; i >= 0; i--){
    var w = S.history[i];
    for(var j = 0; j < w.lifts.length; j++){
      var l = w.lifts[j];
      if(l.name === name && goodLift(l)) out.push({d:w.date, v:l.weight});
    }
  }
  return out;
}
function bodySeries(){
  var out = [];
  for(var i = S.history.length - 1; i >= 0; i--){
    var bw = S.history[i].bw;
    if(bw != null && bw > 0) out.push({d:S.history[i].date, v:bw});
  }
  return out;
}
function chartNames(){
  var seen = {}, out = [];
  S.history.forEach(function(w){ w.lifts.forEach(function(l){
    if(!goodLift(l)) return;
    if(!seen[l.name]){ seen[l.name] = 1; out.push(l.name); } }); });
  return out;
}

var RANGES = [["w","1W",7],["m","1M",30],["s","6M",182],["y","1Y",365],["all","All",0]];
function rangeDays(k){
  for(var i=0;i<RANGES.length;i++) if(RANGES[i][0] === k) return RANGES[i][2];
  return 0;
}
function inRange(pts, k){
  var days = rangeDays(k);
  if(!days) return pts;
  var cut = new Date(); cut.setHours(0,0,0,0);
  cut.setDate(cut.getDate() - (days - 1));
  return pts.filter(function(p){
    var d = new Date(String(p.d).slice(0,10) + "T00:00:00");
    return !isNaN(d) && d >= cut;
  });
}
function shortDate(d){ var p = String(d).split("-"); return p.length===3 ? (+p[1])+"/"+(+p[2]) : d; }

function chartSVG(pts, fmt){
  fmt = fmt || function(v){ return Math.round(v); };
  if(!pts.length) return '<div class="sub">No data to chart.</div>';
  var W = 340, H = 190, L = 44, R = 10, T = 14, B = 26;
  var vs = pts.map(function(p){ return p.v; });
  var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
  if(mn === mx){ mn -= 5; mx += 5; }
  var span = mx - mn; mn -= span*0.12; mx += span*0.12;
  function X(i){ return pts.length === 1 ? L + (W-L-R)/2 : L + i*(W-L-R)/(pts.length-1); }
  function Y(v){ return T + (mx-v)/(mx-mn)*(H-T-B); }
  var g = "";
  for(var k = 0; k <= 2; k++){
    var v = mn + (mx-mn)*k/2, y = Y(v);
    g += '<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'
       + '<text x="'+(L-6)+'" y="'+(y+4).toFixed(1)+'" fill="var(--dim)" font-size="11" text-anchor="end">'+fmt(v)+'</text>';
  }
  var d = pts.map(function(p,i){ return (i?"L":"M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1); }).join(" ");
  var dots = pts.length > 40 ? "" : pts.map(function(p,i){
    return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="var(--done)"/>'; }).join("");
  var xl = '<text x="'+L+'" y="'+(H-6)+'" fill="var(--dim)" font-size="11">'+shortDate(pts[0].d)+'</text>';
  if(pts.length > 1)
    xl += '<text x="'+(W-R)+'" y="'+(H-6)+'" fill="var(--dim)" font-size="11" text-anchor="end">'+shortDate(pts[pts.length-1].d)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">'
    + g + '<path d="'+d+'" fill="none" stroke="var(--done)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
    + dots + xl + '</svg>';
}

function vCharts(){
  var names = chartNames();
  var pick = window.__chart;
  var special = ["__bw","__runpace","__walkpace"];
  if(!pick || (special.indexOf(pick) < 0 && names.indexOf(pick) < 0)) pick = names[0] || "__bw";
  var isPace = pick === "__runpace" || pick === "__walkpace";
  var all = pick === "__bw" ? bodySeries()
    : pick === "__runpace" ? pacePoints("run")
    : pick === "__walkpace" ? pacePoints("walk")
    : seriesFor(pick);
  var rk = window.__range || "all";
  var pts = inRange(all, rk);
  var pills = names.map(function(n){
      return '<button class="pill'+(pick===n?' on':'')+'" onclick="window.__chart='+JSON.stringify(n).replace(/"/g,"&quot;")+';render()">'+esc(n)+'</button>';
    }).join("")
    + '<button class="pill'+(pick==="__bw"?' on':'')+'" onclick="window.__chart=\'__bw\';render()">Body weight</button>'
    + (hasPace("run") ? '<button class="pill'+(pick==="__runpace"?' on':'')+'" onclick="window.__chart=\'__runpace\';render()">Run pace</button>' : '')
    + (hasPace("walk") ? '<button class="pill'+(pick==="__walkpace"?' on':'')+'" onclick="window.__chart=\'__walkpace\';render()">Walk pace</button>' : '');
  var head = "";
  if(pts.length){
    var first = pts[0].v, last = pts[pts.length-1].v, diff = last - first;
    var good = isPace ? diff <= 0 : diff >= 0;
    var shownLast = isPace ? sec2dur(last)+"/mi" : last;
    var shownDiff = isPace ? (diff<0?"−":"+")+sec2dur(Math.abs(diff))
      : (diff>0?"+":"")+Math.round(diff*10)/10;
    head = '<div class="row" style="margin-bottom:12px"><div><div class="label">Latest</div>'
      + '<div class="num" style="font-size:30px;font-weight:600">'+shownLast+'</div></div>'
      + '<div style="text-align:right"><div class="label">Change</div>'
      + '<div class="num" style="font-size:18px;color:'+(good?'var(--done)':'var(--rest)')+'">'
      + shownDiff+'</div>'
      + '<div class="sub">over '+pts.length+' session'+(pts.length===1?'':'s')+'</div></div></div>';
  }
  var rangePills = '<div class="tabbar" style="margin-bottom:12px">'
    + RANGES.map(function(r){
        return '<button class="'+(rk===r[0]?"on":"")+'" onclick="window.__range=\''+r[0]+'\';render()">'+r[1]+'</button>';
      }).join("") + '</div>';
  return '<div class="head"><div class="h1">Progress</div><button class="link" onclick="goBack()">Back</button></div>'
    + '<div style="margin-bottom:12px">'+pills+'</div>'
    + rangePills
    + '<div class="card">' + head + chartSVG(pts, isPace ? function(v){ return sec2dur(v); } : null)
    + (!pts.length && all.length
        ? '<div class="note">Nothing in this window — ' + all.length + ' entr' + (all.length===1?'y':'ies') + ' further back.</div>' : '')
    + '</div>'
    + (isPace && pts.length ? '<div class="note">Lower is faster — a line trending down is improvement.</div>' : '')
    + (pick === "__bw" && !pts.length
        ? '<div class="note">Body weight is recorded when you type it in at the end of a workout.</div>' : '');
}

    + '<div class="grid" style="margin-top:10px">'
    + '<div><div class="label">Meal</div><select id="f_meal">'
    + MEALS.map(function(m){ return '<option value="' + m + '">' + m + '</option>'; }).join("")
    + '</select></div>'
    + '<div><div class="label">Date</div><input id="f_date" type="date" value="' + today + '"></div></div>'
    + '<button class="btn" style="margin-top:12px" onclick="addFood()">Save item</button>'
    + (msg ? '<div class="note" style="color:var(--text)">' + esc(msg) + '</div>' : '')
    + '</div>';

  function avgBlock(n, label){
    var a = avgOver(n);
    if(!a) return '';
    return '<div class="item"><div><div>' + label + '</div>'
      + '<div class="sub">' + a.days + ' day' + (a.days===1?'':'s') + ' logged</div></div>'
      + '<div style="text-align:right"><div class="num">' + a.kcal + ' in</div>'
      + '<div class="sub num">' + a.burn + ' out · net ' + a.net + '</div></div></div>';
  }
  var roll = '<div class="card"><div class="label" style="margin-bottom:4px">Daily averages</div>'
    + (avgBlock(7, "Last 7 days") + avgBlock(30, "Last 30 days") || '<div class="sub">Log a few days to see averages.</div>')
    + '</div>';

  var week = lastDays(7).map(function(r){
    if(!r.t.kcal && !r.t.burn) return '';
    return '<div class="item"><span class="sub">' + shortDate(r.date) + '</span>'
      + '<span class="num">' + (r.t.kcal || '—') + ' in · ' + (r.t.burn || 0) + ' out · '
      + '<b>' + r.t.net + '</b></span></div>';
  }).join("");

  return ring + form
    + '<div class="card"><div class="label" style="margin-bottom:4px">Today\'s items</div>' + list + '</div>'
    + roll
    + (week ? '<div class="card"><div class="label" style="margin-bottom:4px">This week</div>' + week + '</div>' : '')
    + '<div class="note">Burn figures come from your logged activities. Garmin\'s calorie number includes the resting calories you\'d have burned anyway, so treat net as optimistic.</div>';
}

function vHome(){

function pLift(){
  var w = workout(S.nextId), last = S.history[0];
  var lifts = w.lifts.map(function(l){
    return '<div class="item"><span>'+esc(l.name)+'</span><span class="sub num">'+

  return resume
    + '<div class="card"><div class="label">Up next</div>'

    + '<button class="btn solid" style="margin-top:16px" onclick="startWorkout()">Start workout</button></div>'
    + (last ? '<div class="card"><div class="label">Last session</div><div style="margin-top:4px">'+esc(last.name)+' · '+last.date+(last.bw?' · '+last.bw+' lb':'')+'</div>'
        + '<div class="sub" style="margin-top:4px">'+last.lifts.map(function(l){return esc(l.name)+' '+l.weight;}).join(' · ')+'</div></div>' : '')
    + '<button class="btn solid" style="margin-bottom:8px" onclick="go(\'charts\')">Progress charts</button>'
    + '<div class="grid" style="margin-bottom:8px">'
    + '<button class="btn" onclick="go(\'plates\')">Plates</button>'
    + '<button class="btn" onclick="go(\'edit\')">Workouts</button>'
    + '<button class="btn" onclick="go(\'cal\')">Schedule</button></div>'
    + '<div class="grid">'
    + '<button class="btn" onclick="go(\'history\')">History</button>'
    + '<button class="btn" onclick="go(\'export\')">Export</button></div>'
    + (msg ? '<div class="note" style="color:var(--rest)">'+esc(msg)+'</div>' : '');
}

function vWorkout(){
  var any = session.lifts.some(function(l){ return l.logged.some(function(r){ return r !== null; }); });
  var body = session.lifts.map(function(l, li){
    var warm = l.warm.length ? '<div class="label" style="margin-top:14px">Warm-up</div><div class="sets">'
      + l.warm.map(function(w, wi){
          return '<button class="set warm'+(w.done?' hit':'')+'" onclick="tapWarm('+li+','+wi+')">'
            + '<div class="num">'+w.w+'</div><div style="font-size:11px;font-weight:400">×'+w.reps+'</div></button>';
        }).join("") + '</div>' : '';
    var sets = '<div class="sets">' + l.logged.map(function(r, si){
      var cls = r === l.reps ? ' hit' : (r !== null && r < l.reps ? ' miss' : '');
      return '<button class="set'+cls+'" onclick="tapSet('+li+','+si+')">'+(r===null?l.reps:r)+'</button>';
    }).join("") + '</div>';
    return '<div class="card"><div class="row">'
      + '<div><div style="font-weight:500">'+esc(l.name)+'</div>'
      + '<div class="sub">'+l.sets+'×'+l.reps+' · '+l.rest+'s rest</div></div>'
      + '<div class="row" style="gap:8px">'
      + '<button class="step" onclick="bumpSession('+li+',-5)">–</button>'
      + '<div class="wt num">'+l.weight+'</div>'
      + '<button class="step" onclick="bumpSession('+li+',5)">+</button></div></div>'
      + '<div style="margin-top:12px">'+plateHTML(l.weight)+'</div>'
      + warm + '<div class="label" style="margin-top:14px">Working sets</div>' + sets + '</div>';
  }).join("");
  var restBar = restEnd ? '<div id="restbar" class="bar'+(restLeft()>0?'':' off')+'">'
    + '<div><div style="font-size:11px;color:#F6C9CF">Rest</div>'
    + '<div id="clock" class="clock num">'+mmss(restLeft())+'</div></div>'
    + '<div style="display:flex;gap:8px">'
    + '<button class="ghost" onclick="restEnd+=30000;render()">+30s</button>'
    + '<button class="ghost" onclick="restEnd=null;render()">Done</button></div></div>' : '';
  return '<div class="head"><div class="h1">'+esc(session.name)+'</div>'
    + '<button class="link" onclick="session=null;restEnd=null;go(\'home\')">Cancel</button></div>'
    + body
    + '<div class="card"><div class="label">Body weight today (optional)</div>'
    + '<input id="bw" inputmode="decimal" value="'+esc(session.bw)+'" placeholder="269" '
    + 'oninput="session.bw=this.value"></div>'
    + '<button class="btn solid" '+(any?'':'disabled')+' onclick="finishWorkout()">Finish and save</button>'
    + '<div class="note">Tap a set to log all reps and start the rest clock. Tap again to count down if you missed reps. Warm-ups don\'t affect progression.</div>'
    + restBar;
}

    + '<div style="margin-top:8px">'+plateHTML(val)+'</div></div>'
    + '<div class="card"><div class="label">Quick pick</div><div style="margin-top:8px">'
    + Object.keys(S.weights).map(function(k){
        return '<button class="pill" onclick="window.__calc='+S.weights[k]+';render()">'+esc(k)+' '+S.weights[k]+'</button>';

}

      return '<div class="card" style="background:var(--card2);margin-bottom:8px">'

        + '<button class="step" onclick="bumpWeight(\''+esc(l.name)+'\',5)">+</button></div></div>'
        + '<div class="row" style="margin-top:12px"><span class="sub">Warm-up sets</span>'

            + '<input class="num" inputmode="numeric" value="'+(l.minWarm||0)+'" onchange="setMinWarm(\''+w.id+'\','+i+',this.value)"></div>' : '')

function pCardio(){
  var list = S.activities.slice(0,40).map(function(a,i){
    var bits = [];
    if(a.dist) bits.push(a.dist.toFixed(2)+" mi");
    if(a.sec) bits.push(sec2dur(a.sec));
    var p = paceOf(a) || (a.pace ? a.pace+"/mi" : "");
    if(p) bits.push(p);
    if(a.hr) bits.push(a.hr+" bpm");
    if(a.cad) bits.push(a.cad+" spm");
    return '<div class="card" style="background:var(--card2);padding:13px">'
      + '<div class="row"><div><div style="font-weight:500">'+esc(a.title || a.type)+'</div>'
      + '<div class="sub">'+a.date+' · '+esc(a.type)+(a.src==="garmin"?" · Garmin":"")
      + (S.filterJunk && onFoot(a.type) && !realFoot(a) ? ' · <span style="color:var(--rest)">not counted</span>' : '')+'</div></div>'
      + '<button class="step" style="width:30px;height:30px;font-size:15px;color:var(--rest)" onclick="delActivity('+i+')">×</button></div>'
      + '<div class="sub num" style="margin-top:8px">'+bits.join(" · ")+'</div></div>';
  }).join("") || '<div class="sub">Nothing logged yet.</div>';

  var w = rolling(7), m = rolling(30);
  function stat(label, a, b, unit){
    return '<div class="item"><span class="sub">'+label+'</span>'
      + '<span class="num">'+a+' <span class="sub">'+unit+'</span>'
      + '<span class="sub" style="margin:0 8px">/</span>'+b+' <span class="sub">'+unit+'</span></span></div>';
  }
  var totals = '<div class="card">'
    + '<div class="row" style="margin-bottom:6px"><div class="label">Rolling totals</div>'
    + '<div class="label">7 days / 30 days</div></div>'
    + stat("Miles on foot", w.miles.toFixed(1), m.miles.toFixed(1), "mi")
    + stat("Calories burned", w.cals.toLocaleString(), m.cals.toLocaleString(), "kcal")
    + stat("Sessions", w.all, m.all, "")
    + '<button class="btn" style="margin-top:14px" onclick="window.__chart=\'__runpace\';go(\'charts\')">Pace charts</button>'
    + (m.cals === 0 && m.all > 0 ? '<div class="note">No calorie data on these — Garmin imports carry it, manual entries need the field filled in.</div>' : '')
    + (S.filterJunk && junkCount(30) ? '<div class="note">' + junkCount(30) + ' walk-tagged activit' + (junkCount(30)===1?'y':'ies') + ' excluded as GPS drift. Turn the filter off in Settings to include them.</div>' : '')
    + '</div>';

  return totals
    + '<div class="card"><div class="label" style="margin-bottom:10px">Log one by hand</div>'
    + '<div class="grid"><div><div class="label">Date</div><input id="r_date" type="date" value="'+todayISO()+'"></div>'
    + '<div><div class="label">Type</div><input id="r_type" value="Running"></div></div>'
    + '<div class="grid" style="margin-top:10px">'
    + '<div><div class="label">Distance (mi)</div><input id="r_dist" inputmode="decimal" placeholder="2.14"></div>'
    + '<div><div class="label">Time</div><input id="r_time" placeholder="25:28"></div></div>'
    + '<div class="grid" style="margin-top:10px">'
    + '<div><div class="label">Avg HR</div><input id="r_hr" inputmode="numeric" placeholder="181"></div>'
    + '<div><div class="label">Cadence</div><input id="r_cad" inputmode="numeric" placeholder="158"></div>'
    + '<div><div class="label">Calories</div><input id="r_cal" inputmode="numeric" placeholder="370"></div></div>'
    + '<div style="margin-top:10px"><div class="label">Note</div><input id="r_title" placeholder="3:1 run/walk, felt easy"></div>'
    + '<button class="btn" style="margin-top:12px" onclick="addRunManual()">Save activity</button>'
    + '<div class="note">Bulk import from a Garmin CSV lives in Settings.</div></div>'
    + (msg ? '<div class="note" style="color:var(--text)">'+esc(msg)+'</div>' : '')
    + '<div class="grid" style="margin-top:4px">'
    + '<button class="btn" onclick="go(\'cal\')">Schedule</button>'
    + '<button class="btn" onclick="go(\'export\')">Export</button></div>'
    + '<div class="label" style="margin:18px 0 8px">Logged</div>' + list;
}

function copyOut(){
  var t = exportCSV();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ msg="Copied."; render(); },
      function(){ msg="Couldn't copy — select the text below instead."; render(); });
  } else { msg = "Select the text below and copy it."; render(); }
}

          + '<span class="num" style="min-width:44px;text-align:center">'+incOf(k)+'</span>'
          + '<button class="step" onclick="S.inc[\''+esc(k)+'\']=incOf(\''+esc(k)+'\')+2.5;save();render()">+</button></div></div>';
      }).join("") + '</div>'
    + '<button class="btn warn" onclick="if(confirm(\'Erase all workouts and history?\')){localStorage.removeItem(KEY);load();go(\'home\')}">Reset everything</button>';
}

// ---------- render ----------
function render(){
  var h;
  if(view === "workout" && session) h = vWorkout();
  else if(view === "plates") h = vPlates();
  else if(view === "charts") h = vCharts();
  else if(view === "edit") h = vEdit();
  else if(view === "cal") h = vCal();
  else if(view === "history") h = vHistory();
  else if(view === "export") h = vExport();
  else if(view === "settings") h = vSettings();
  else h = vHome();
  document.getElementById("app").innerHTML = h;
}

load();
try { history.replaceState({i:0}, ""); } catch(e){}
render();
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
